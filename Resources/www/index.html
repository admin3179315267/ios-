<title>水印查询系统</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #0f5cbf;
    --primary-light: #e8f0fe;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e3e8ef;
    --danger: #d93025;
    --success: #188038;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(26, 115, 232, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }

  /* ===== 左侧菜单栏 ===== */
  .sidebar {
    width: 240px;
    background: #ffffff;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .brand {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), #4d9fff);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    margin-bottom: 12px;
  }
  .brand h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  .brand p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .nav { padding: 16px 12px; flex: 1; }
  .nav .nav-label {
    font-size: 11px; color: #9aa3af; letter-spacing: 1px;
    margin: 0 12px 8px; text-transform: uppercase;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; margin-bottom: 6px;
    border-radius: 10px; cursor: pointer;
    font-size: 14px; color: var(--text-muted);
    transition: all .18s ease;
    border: 1px solid transparent;
  }
  .nav-item .badge {
    margin-left: auto; font-size: 11px;
    background: var(--primary-light); color: var(--primary);
    padding: 2px 8px; border-radius: 20px; font-weight: 600;
  }
  .nav-item:hover { background: #f6f9fd; color: var(--text); }
  .nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: #d0e3fe;
    font-weight: 600;
  }

  .sidebar-footer {
    padding: 16px 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: #9aa3af; line-height: 1.6;
  }

  /* ===== 右侧功能区 ===== */
  .main {
    flex: 1;
    padding: 28px 36px;
    max-width: 920px;
    min-height: 100vh;
  }

  .page-header { margin-bottom: 24px; }
  .page-header h2 { font-size: 22px; font-weight: 700; }
  .page-header p { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 15px; font-weight: 600; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title .step {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--primary); color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  /* 上传区 */
  .dropzone {
    border: 2px dashed #c7d7f0;
    border-radius: 12px;
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
    background: #fafcff;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .dropzone p { font-size: 14px; color: var(--text-muted); }
  .dropzone .hint { font-size: 12px; color: #9aa3af; margin-top: 6px; }
  .dropzone.has-image { border-style: solid; border-color: var(--success); }

  .preview-wrap {
    display: none; align-items: center; gap: 18px; margin-top: 16px;
  }
  .preview-wrap img {
    max-height: 140px; max-width: 260px;
    border-radius: 10px; border: 1px solid var(--border);
    background: repeating-conic-gradient(#f0f0f0 0 25%, #fff 0 50%) 0 0/16px 16px;
  }
  .preview-info { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
  .preview-info .fname { color: var(--text); font-weight: 600; }

  /* 参数区 */
  .param-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .field label {
    display: block; font-size: 13px; color: var(--text-muted);
    margin-bottom: 6px; font-weight: 500;
  }
  .field input[type="number"], .field input[type="text"] {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--text);
    transition: border .15s ease, box-shadow .15s ease;
  }
  .field input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
  }
  .checkbox-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-muted); cursor: pointer;
  }
  .checkbox-line input { width: 16px; height: 16px; accent-color: var(--primary); }

  .divider { height: 1px; background: var(--border); margin: 22px 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 10px;
    padding: 13px 30px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .18s ease;
    width: 100%; justify-content: center;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { background: #b8c6d9; cursor: not-allowed; }
  .btn .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 结果区 */
  .result { display: none; }
  .result.ok { display: block; }
  .result-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    font-size: 15px; font-weight: 600; color: var(--success);
  }
  .result-head .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--success);
  }
  .wm-display {
    text-align: center; padding: 20px;
    background: #fafcff; border: 1px solid var(--border); border-radius: 10px;
  }
  .wm-display .wm-label { font-size: 12px; color: #9aa3af; margin-bottom: 12px; }
  .wm-display img {
    image-rendering: pixelated;
    width: 100%; max-width: 640px; height: auto;
    border: 1px solid #dbe3ee; border-radius: 6px;
    display: inline-block;
  }
  .result-meta {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;
  }
  .meta-chip {
    font-size: 13px; color: var(--text-muted);
    background: #f1f5fb; padding: 6px 12px; border-radius: 8px;
  }
  .meta-chip b { color: var(--text); }
  .btn-secondary {
    margin-top: 16px; display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--primary);
    border: 1px solid var(--primary); border-radius: 10px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .15s ease; text-decoration: none;
  }
  .btn-secondary:hover { background: var(--primary-light); }

  .error-box {
    display: none; margin-top: 16px;
    background: #fdecea; border: 1px solid #f5c6c0;
    color: var(--danger); border-radius: 10px;
    padding: 14px 16px; font-size: 14px;
  }
  .error-box.show { display: block; }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; }
    .nav { display: flex; gap: 8px; }
    .nav-item { flex: 1; justify-content: center; }
    .main { padding: 20px; }
    .param-grid { grid-template-columns: 1fr; }
  }
</style>

<body>

  <!-- 左侧菜单栏 -->
  <aside class="sidebar">
    <div class="brand">
      
      <h1>机标查询</h1>
      <p>提取水印图片</p>
    </div>
    <nav class="nav">
      <div class="nav-label">查询方式</div>
      <div class="nav-item active" data-mode="auto">
        <span>普通机标查询</span>
        <span class="badge">DFT</span>
      </div>
      <div class="nav-item" data-mode="fast">
        <span>快速机标查询</span>
        <span class="badge">DCT</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      支持 PNG / JPG 图片<br>
      查询参数需与嵌入时一致
    </div>
  </aside>

  <!-- 右侧功能区 -->
  <main class="main">
    <div class="page-header">
      <h2 id="pageTitle">机标查询</h2>
      <p id="pageSub">上传带水印的图片，提取其中的水印图片（DFT / SVD 盲水印）。</p>
    </div>

    <!-- 上传 -->
    <div class="card">
      <div class="card-title"><span class="step">1</span>上传图片</div>
      <div class="dropzone" id="dropzone">
        <p>点击或拖拽图片到此处</p>
        <div class="hint">支持 PNG / JPG / BMP，含透明通道亦可</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden="">
      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" alt="预览">
        <div class="preview-info">
          <div class="fname" id="fileName"></div>
          <div id="fileSize"></div>
          <div id="fileDims"></div>
        </div>
      </div>
    </div>

    <!-- 参数 -->
    <div class="card">
      <div class="card-title"><span class="step">2</span>查询参数</div>
      <div class="param-grid" id="paramGrid"><div class="field"><label>水印密码<span style="color:#9aa3af"> （与嵌入时一致，留空用默认）</span></label><input type="number" id="f_password" value=""></div><div class="field"><label>水印宽度<span style="color:#9aa3af"> （默认 150）</span></label><input type="number" id="f_wm_w" value="150"></div><div class="field"><label>水印高度<span style="color:#9aa3af"> （默认 40）</span></label><input type="number" id="f_wm_h" value="40"></div><div class="field"><label>强度 d1<span style="color:#9aa3af"> （与嵌入时一致）</span></label><input type="number" id="f_d1" value="20"></div><div class="field"><label>强度 d2<span style="color:#9aa3af"> （与嵌入时一致）</span></label><input type="number" id="f_d2" value="10"></div><div class="field" style="grid-column: 1 / -1;"><label class="checkbox-line"><input type="checkbox" id="f_auto_detect"> 自动探测水印尺寸（不指定宽高时尝试多种常见尺寸）</label></div></div>
    </div>

    <!-- 按钮 -->
    <button class="btn" id="queryBtn">查询水印</button>

    <!-- 结果 -->
    <div class="card result" id="resultCard">
      <div class="result-head"><span class="dot"></span><span id="resultTitle">提取成功</span></div>

<script>
/* ============================================================
 * 纯前端水印提取算法（复刻 numpy / pywt / cv2）
 * ============================================================ */
(function () {
  const RK = 624;

  function MT19937(seed) {
    this.mt = new Uint32Array(RK);
    this.pos = RK;
    this.mt[0] = seed >>> 0;
    for (let i = 1; i < RK; i++) {
      const x = this.mt[i - 1] ^ (this.mt[i - 1] >>> 30);
      this.mt[i] = (Math.imul(1812433253, x) + i) >>> 0;
    }
  }
  MT19937.prototype.twist = function () {
    const mt = this.mt;
    for (let i = 0; i < RK; i++) {
      const y = (mt[i] & 0x80000000) | (mt[(i + 1) % RK] & 0x7fffffff);
      mt[i] = (mt[(i + 397) % RK] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0)) >>> 0;
    }
    this.pos = 0;
  };
  MT19937.prototype.uint32 = function () {
    if (this.pos >= RK) this.twist();
    let y = this.mt[this.pos++];
    y ^= (y >>> 11);
    y ^= (y << 7) & 0x9d2c5680;
    y ^= (y << 15) & 0xefc60000;
    y ^= (y >>> 18);
    return y >>> 0;
  };
  MT19937.prototype.double = function () {
    const a = this.uint32() >>> 5;
    const b = this.uint32() >>> 6;
    return (a * 67108864.0 + b) / 9007199254740992.0;
  };
  MT19937.prototype.interval = function (max) {
    if (max <= 1) return 0;
    let mask = (max - 1) >>> 0;
    mask |= mask >>> 1;
    mask |= mask >>> 2;
    mask |= mask >>> 4;
    mask |= mask >>> 8;
    mask |= mask >>> 16;
    let value;
    do { value = this.uint32() & mask; } while (value >= max);
    return value;
  };
  MT19937.prototype.randint = function (low, high) {
    return low + this.interval(high - low);
  };
  MT19937.prototype.permutation = function (n) {
    const a = new Array(n);
    for (let i = 0; i < n; i++) a[i] = i;
    for (let i = n - 1; i > 0; i--) {
      const j = this.interval(i + 1);
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  // OpenCV COLOR_BGR2YUV (BT.601, float 域，U/V 偏移 0.5)
  function bgr2yuv(r, g, b) {
    return {
      y: 0.114 * b + 0.587 * g + 0.299 * r,
      u: 0.436 * b - 0.28886 * g - 0.14713 * r + 0.5,
      v: -0.10001 * b - 0.51499 * g + 0.615 * r + 0.5
    };
  }
  function bgr2gray(r, g, b) {
    return 0.114 * b + 0.587 * g + 0.299 * r;
  }

  function makeDctMatrix(n) {
    const D = new Float64Array(n * n);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        D[i * n + j] = (i === 0) ? Math.sqrt(1 / n) : Math.sqrt(2 / n) * Math.cos(Math.PI * (2 * j + 1) * i / (2 * n));
      }
    }
    return D;
  }
  const _DCT4 = makeDctMatrix(4);
  const _DCT8 = makeDctMatrix(8);

  function dct2(X, n) {
    const D = n === 4 ? _DCT4 : _DCT8;
    const out = new Float64Array(n * n);
    const tmp = new Float64Array(n * n);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        let s = 0;
        for (let k = 0; k < n; k++) s += D[i * n + k] * X[k * n + j];
        tmp[i * n + j] = s;
      }
    }
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        let s = 0;
        for (let k = 0; k < n; k++) s += tmp[i * n + k] * D[j * n + k];
        out[i * n + j] = s;
      }
    }
    return out;
  }

  function svdSingularValues4(A) {
    const n = 4;
    const B = new Float64Array(n * n);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        let s = 0;
        for (let k = 0; k < n; k++) s += A[k * n + i] * A[k * n + j];
        B[i * n + j] = s;
      }
    }
    const a = Float64Array.from(B);
    for (let iter = 0; iter < 240; iter++) {
      let p = 0, q = 1, mx = Math.abs(a[1]);
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const v = Math.abs(a[i * n + j]);
          if (v > mx) { mx = v; p = i; q = j; }
        }
      }
      if (mx < 1e-13) break;
      const app = a[p * n + p], aqq = a[q * n + q], apq = a[p * n + q];
      const tau = (aqq - app) / (2 * apq);
      let t;
      if (tau >= 0) t = 1 / (tau + Math.sqrt(1 + tau * tau));
      else t = -1 / (-tau + Math.sqrt(1 + tau * tau));
      const c = 1 / Math.sqrt(1 + t * t), s = t * c;
      for (let k = 0; k < n; k++) {
        if (k === p || k === q) continue;
        const akp = a[k * n + p], akq = a[k * n + q];
        a[k * n + p] = c * akp - s * akq;
        a[k * n + q] = s * akp + c * akq;
        a[p * n + k] = a[k * n + p];
        a[q * n + k] = a[k * n + q];
      }
      a[p * n + p] = app - t * apq;
      a[q * n + q] = aqq + t * apq;
      a[p * n + q] = a[q * n + p] = 0;
    }
    const eig = [a[0], a[5], a[10], a[15]];
    for (let i = 0; i < n; i++) if (eig[i] < 0) eig[i] = 0;
    eig.sort((x, y) => y - x);
    return [Math.sqrt(eig[0]), Math.sqrt(eig[1]), Math.sqrt(eig[2]), Math.sqrt(eig[3])];
  }

  function argsort(vals) {
    const idx = [];
    for (let i = 0; i < vals.length; i++) idx.push(i);
    idx.sort((a, b) => vals[a] - vals[b]);
    return idx;
  }

  function oneDimKmeans(inputs) {
    const n = inputs.length;
    let c0 = inputs[0], c1 = inputs[0];
    for (let i = 1; i < n; i++) { if (inputs[i] < c0) c0 = inputs[i]; if (inputs[i] > c1) c1 = inputs[i]; }
    let threshold = 0;
    const e_tol = 1e-6;
    for (let iter = 0; iter < 300; iter++) {
      threshold = (c0 + c1) / 2;
      let loSum = 0, loCnt = 0, hiSum = 0, hiCnt = 0;
      for (let j = 0; j < n; j++) {
        if (inputs[j] > threshold) { hiSum += inputs[j]; hiCnt++; }
        else { loSum += inputs[j]; loCnt++; }
      }
      if (loCnt === 0 || hiCnt === 0) break;
      c0 = loSum / loCnt;
      c1 = hiSum / hiCnt;
      if (Math.abs((c0 + c1) / 2 - threshold) < e_tol) { threshold = (c0 + c1) / 2; break; }
    }
    const out = new Uint8Array(n);
    for (let j = 0; j < n; j++) out[j] = inputs[j] > threshold ? 1 : 0;
    return out;
  }

  function decrypt(bits, password) {
    const n = bits.length;
    const perm = new MT19937(password).permutation(n);
    const inv = new Int32Array(n);
    for (let i = 0; i < n; i++) inv[perm[i]] = i;
    const out = new Uint8Array(n);
    for (let j = 0; j < n; j++) out[j] = bits[inv[j]];
    return out;
  }

  // rgb: { h, w, r, g, b } (Float64Array)
  function extractAuto(rgb, wmH, wmW, d1, d2, passwordImg, passwordWm, wmSize) {
    const H = rgb.h, W = rgb.w;
    const r = rgb.r, g = rgb.g, b = rgb.b;

    const yc = new Float64Array(H * W), uc = new Float64Array(H * W), vc = new Float64Array(H * W);
    for (let i = 0; i < H * W; i++) {
      const c = bgr2yuv(r[i], g[i], b[i]);
      yc[i] = c.y; uc[i] = c.u; vc[i] = c.v;
    }

    const padH = H % 2, padW = W % 2;
    const HH = H + padH, WW = W + padW;
    function padAndDwt(ch) {
      const out = new Float64Array(HH * WW);
      for (let y = 0; y < H; y++) {
        const srcOff = y * W, dstOff = y * WW;
        for (let x = 0; x < W; x++) out[dstOff + x] = ch[srcOff + x];
      }
      const caH = HH / 2, caW = WW / 2;
      const ca = new Float64Array(caH * caW);
      for (let i = 0; i < caH; i++) {
        for (let j = 0; j < caW; j++) {
          const o0 = (2 * i) * WW + (2 * j);
          ca[i * caW + j] = (out[o0] + out[o0 + 1] + out[o0 + WW] + out[o0 + WW + 1]) / 2;
        }
      }
      return { ca: ca, caH: caH, caW: caW };
    }

    const channels = [padAndDwt(yc), padAndDwt(uc), padAndDwt(vc)];
    const caH = channels[0].caH, caW = channels[0].caW;
    const blockRows = Math.floor(caH / 4), blockCols = Math.floor(caW / 4);
    const blockNum = blockRows * blockCols;

    if (blockNum <= 0) throw new Error('图片太小，无法分块提取水印');

    const rng = new MT19937(passwordImg);
    const shufflers = new Int32Array(blockNum * 16);
    for (let blk = 0; blk < blockNum; blk++) {
      const vals = new Float64Array(16);
      for (let i = 0; i < 16; i++) vals[i] = rng.double();
      const ord = argsort(vals);
      for (let i = 0; i < 16; i++) shufflers[blk * 16 + i] = ord[i];
    }

    const wmBlockBit = new Float64Array(3 * blockNum);
    const dctBuf = new Float64Array(16);
    for (let ch = 0; ch < 3; ch++) {
      const ca = channels[ch].ca, caw = channels[ch].caW;
      for (let blk = 0; blk < blockNum; blk++) {
        const rr = Math.floor(blk / blockCols), cc = blk % blockCols;
        let o = 0;
        for (let y = 0; y < 4; y++) {
          const rowOff = (rr * 4 + y) * caw + cc * 4;
          dctBuf[o++] = ca[rowOff];
          dctBuf[o++] = ca[rowOff + 1];
          dctBuf[o++] = ca[rowOff + 2];
          dctBuf[o++] = ca[rowOff + 3];
        }
        const D = dct2(dctBuf, 4);
        const M = new Float64Array(16);
        const shOff = blk * 16;
        for (let i = 0; i < 16; i++) M[i] = D[shufflers[shOff + i]];
        const s = svdSingularValues4(M);
        let wmv = (s[0] % d1 > d1 / 2) ? 1 : 0;
        if (d2) {
          const tmp = (s[1] % d2 > d2 / 2) ? 1 : 0;
          wmv = (wmv * 3 + tmp) / 4;
        }
        wmBlockBit[ch * blockNum + blk] = wmv;
      }
    }

    const wmAvg = new Float64Array(wmSize);
    for (let i = 0; i < wmSize; i++) {
      let sum = 0, cnt = 0;
      for (let ch = 0; ch < 3; ch++) {
        const base = ch * blockNum;
        for (let pos = i; pos < blockNum; pos += wmSize) {
          sum += wmBlockBit[base + pos];
          cnt++;
        }
      }
      wmAvg[i] = sum / cnt;
    }

    return decrypt(oneDimKmeans(wmAvg), passwordWm);
  }

  function getCoeffs(blockIndex, slot, passwordWm) {
    const seed = passwordWm * 100000 + blockIndex * 7 + slot * 13;
    const rng = new MT19937(seed);
    let u, v, u2, v2;
    for (;;) {
      u = rng.randint(1, 8);
      v = rng.randint(1, 8);
      if (4 <= u + v && u + v <= 7) break;
    }
    for (;;) {
      u2 = rng.randint(1, 8);
      v2 = rng.randint(1, 8);
      if (!(u2 === u && v2 === v) && 4 <= u2 + v2 && u2 + v2 <= 7) break;
    }
    if (u * 10 + v <= u2 * 10 + v2) return [[u, v], [u2, v2]];
    else return [[u2, v2], [u, v]];
  }

  function extractFast(rgb, wmH, wmW, passwordWm, wmSize) {
    const H = rgb.h, W = rgb.w;
    const r = rgb.r, g = rgb.g, b = rgb.b;
    const gray = new Float64Array(H * W);
    for (let i = 0; i < H * W; i++) gray[i] = bgr2gray(r[i], g[i], b[i]);

    const BLOCK = 8;
    const bh = Math.floor(H / BLOCK), bw = Math.floor(W / BLOCK);
    const numBlocks = bh * bw;
    if (numBlocks <= 0) throw new Error('图片太小，无法分块提取水印');

    const bitsPerBlock = Math.max(1, Math.min(Math.ceil(wmSize / numBlocks), 8));
    const neededBlocks = Math.ceil(wmSize / bitsPerBlock);

    const blockPositions = new MT19937(passwordWm).permutation(numBlocks).slice(0, neededBlocks);

    const wmBit = new Uint8Array(wmSize);
    const blkBuf = new Float64Array(BLOCK * BLOCK);
    for (let k = 0; k < neededBlocks; k++) {
      const actualIdx = blockPositions[k];
      const row = Math.floor(actualIdx / bw) * BLOCK;
      const col = (actualIdx % bw) * BLOCK;
      let o = 0;
      for (let y = 0; y < BLOCK; y++) {
        const srcOff = (row + y) * W + col;
        for (let x = 0; x < BLOCK; x++) blkBuf[o++] = gray[srcOff + x];
      }
      const dctBlock = dct2(blkBuf, BLOCK);
      const start = k * bitsPerBlock;
      const end = Math.min(start + bitsPerBlock, wmSize);
      for (let slot = 0; start + slot < end; slot++) {
        const [p, q] = getCoeffs(actualIdx, slot, passwordWm);
        const c1 = dctBlock[p[0] * BLOCK + p[1]];
        const c2 = dctBlock[q[0] * BLOCK + q[1]];
        wmBit[start + slot] = c1 > c2 ? 1 : 0;
      }
    }
    return wmBit;
  }

  window.WM = {
    extractAuto: extractAuto,
    extractFast: extractFast
  };
})();

/* ============================================================
 * UI 逻辑
 * ============================================================ */
var MODE = 'auto';
var imageDataUrl = null;

var CONFIGS = {
  auto: {
    title: '机标查询',
    sub: '上传带水印的图片，提取其中的水印内容（DFT / SVD 盲水印）。',
    fields: [
      { key: 'password', label: '水印密码', type: 'number', def: '', hint: '与嵌入时一致，留空用默认' },
      { key: 'wm_w', label: '水印宽度', type: 'number', def: 150, hint: '默认 150' },
      { key: 'wm_h', label: '水印高度', type: 'number', def: 40, hint: '默认 40' },
      { key: 'd1', label: '强度 d1', type: 'number', def: 20, hint: '与嵌入时一致' },
      { key: 'd2', label: '强度 d2', type: 'number', def: 10, hint: '与嵌入时一致' }
    ],
    autoDetect: true
  },
  fast: {
    title: '快速机标查询',
    sub: '上传带水印的图片，提取其中的水印内容（分块 DCT 盲水印）。',
    fields: [
      { key: 'password', label: '水印密码', type: 'number', def: '', hint: '与嵌入时一致，留空用默认' },
      { key: 'wm_w', label: '水印宽度', type: 'number', def: 150, hint: '默认 150' },
      { key: 'wm_h', label: '水印高度', type: 'number', def: 40, hint: '默认 40' }
    ],
    autoDetect: false
  }
};

function renderFields(cfg) {
  var html = '';
  cfg.fields.forEach(function (f) {
    html += '<div class="field">' +
      '<label>' + f.label + '<span style="color:#9aa3af"> （' + f.hint + '）</span></label>' +
      '<input type="' + f.type + '" id="f_' + f.key + '" value="' + f.def + '">' +
      '</div>';
  });
  if (cfg.autoDetect) {
    html += '<div class="field" style="grid-column: 1 / -1;">' +
      '<label class="checkbox-line"><input type="checkbox" id="f_auto_detect"> 自动探测水印尺寸（不指定宽高时尝试多种常见尺寸）</label>' +
      '</div>';
  }
  document.getElementById('paramGrid').innerHTML = html;
}

function switchMode(mode) {
  MODE = mode;
  var cfg = CONFIGS[mode];
  document.getElementById('pageTitle').textContent = cfg.title;
  document.getElementById('pageSub').textContent = cfg.sub;
  document.querySelectorAll('.nav-item').forEach(function (el) {
    el.classList.toggle('active', el.getAttribute('data-mode') === mode);
  });
  renderFields(cfg);
  resetResult();
}

document.querySelectorAll('.nav-item').forEach(function (el) {
  el.addEventListener('click', function () { switchMode(el.getAttribute('data-mode')); });
});

/* 上传 */
var dropzone = document.getElementById('dropzone');
var fileInput = document.getElementById('fileInput');
dropzone.addEventListener('click', function () { fileInput.click(); });
fileInput.addEventListener('change', function () {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});
['dragover', 'dragenter'].forEach(function (ev) {
  dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.add('dragover'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  dropzone.addEventListener(ev, function (e) { e.preventDefault(); dropzone.classList.remove('dragover'); });
});
dropzone.addEventListener('drop', function (e) {
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) {
    showError('请选择图片文件');
    return;
  }
  var reader = new FileReader();
  reader.onload = function (e) {
    var dataUrl = e.target.result;
    imageDataUrl = dataUrl;
    setPreview(file, dataUrl);
  };
  reader.readAsDataURL(file);
}

function setPreview(file, dataUrl) {
  var img = document.getElementById('previewImg');
  img.onload = function () {
    document.getElementById('fileDims').textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px';
  };
  img.src = dataUrl;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
  document.getElementById('previewWrap').style.display = 'flex';
  dropzone.classList.add('has-image');
  dropzone.querySelector('p').textContent = '点击更换图片';
  resetResult();
}

function getVal(key) {
  var el = document.getElementById('f_' + key);
  if (!el) return null;
  return el.value.trim();
}

function resetResult() {
  document.getElementById('resultCard').classList.remove('ok');
  document.getElementById('errorBox').classList.remove('show');
}
function showError(msg) {
  var box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.add('show');
}

/* 从 data URL 解码为像素数组 */
function loadImagePixels(dataUrl, cb) {
  var img = new Image();
  img.onload = function () {
    var w = img.naturalWidth, h = img.naturalHeight;
    var canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    var id = ctx.getImageData(0, 0, w, h);
    var n = w * h;
    var r = new Float64Array(n), g = new Float64Array(n), b = new Float64Array(n);
    var d = id.data;
    for (var i = 0; i < n; i++) {
      r[i] = d[i * 4];
      g[i] = d[i * 4 + 1];
      b[i] = d[i * 4 + 2];
    }
    cb({ h: h, w: w, r: r, g: g, b: b });
  };
  img.onerror = function () { showError('图片解码失败'); };
  img.src = dataUrl;
}

function blackRatio(bits) {
  var zeros = 0;
  for (var i = 0; i < bits.length; i++) if (bits[i] === 0) zeros++;
  return zeros / bits.length;
}

function queryAuto(rgb, password, wmH, wmW, d1, d2, autoDetect) {
  if (autoDetect) {
    var shapes = [[40, 150], [30, 120], [50, 200], [60, 180], [35, 140], [45, 160]];
    for (var i = 0; i < shapes.length; i++) {
      var h = shapes[i][0], w = shapes[i][1];
      try {
        var bits = WM.extractAuto(rgb, h, w, d1, d2, 1, password, h * w);
        var ratio = blackRatio(bits);
        if (ratio > 0.05 && ratio < 0.95) return { bits: bits, w: w, h: h, ratio: ratio };
      } catch (e) { /* 尝试下一个尺寸 */ }
    }
    return null;
  }
  var bits = WM.extractAuto(rgb, wmH, wmW, d1, d2, 1, password, wmH * wmW);
  return { bits: bits, w: wmW, h: wmH, ratio: blackRatio(bits) };
}

function queryFast(rgb, password, wmH, wmW) {
  var bits = WM.extractFast(rgb, wmH, wmW, password, wmH * wmW);
  return { bits: bits, w: wmW, h: wmH, ratio: blackRatio(bits) };
}

/* 查询 */
document.getElementById('queryBtn').addEventListener('click', function () {
  if (!imageDataUrl) { showError('请先上传要查询的图片'); return; }

  var pwVal = getVal('password');
  var password = (pwVal === '' || pwVal === null) ? 1 : (parseInt(pwVal, 10) || 1);
  var wmW = parseInt(getVal('wm_w'), 10) || 150;
  var wmH = parseInt(getVal('wm_h'), 10) || 40;

  var btn = document.getElementById('queryBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 正在提取水印…';
  resetResult();

  loadImagePixels(imageDataUrl, function (rgb) {
    setTimeout(function () {
      try {
        var result;
        if (MODE === 'auto') {
          var d1 = parseInt(getVal('d1'), 10) || 20;
          var d2 = parseInt(getVal('d2'), 10) || 10;
          var autoDetect = document.getElementById('f_auto_detect') && document.getElementById('f_auto_detect').checked;
          result = queryAuto(rgb, password, wmH, wmW, d1, d2, autoDetect);
        } else {
          result = queryFast(rgb, password, wmH, wmW);
        }
        btn.disabled = false;
        btn.innerHTML = '查询水印';
        if (result) {
          showResult(result);
        } else {
          showError('未能提取到水印，请确认密码 / 水印尺寸 / 强度参数与嵌入时一致');
        }
      } catch (e) {
        btn.disabled = false;
        btn.innerHTML = '查询水印';
        showError('提取出错：' + e.message);
      }
    }, 30);
  });
});

function showResult(res) {
  var url = bitsToImageURL(res.bits, res.w, res.h);
  document.getElementById('wmImg').src = url;
  document.getElementById('metaSize').textContent = res.w + ' × ' + res.h;
  document.getElementById('metaRatio').textContent = (res.ratio * 100).toFixed(1) + '%';
  document.getElementById('dlBtn').href = url;
  document.getElementById('resultCard').classList.add('ok');
}

function bitsToImageURL(bits, w, h) {
  var canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  var ctx = canvas.getContext('2d');
  var id = ctx.createImageData(w, h);
  for (var i = 0; i < w * h; i++) {
    var v = bits[i] ? 255 : 0;
    id.data[i * 4] = v;
    id.data[i * 4 + 1] = v;
    id.data[i * 4 + 2] = v;
    id.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  return canvas.toDataURL('image/png');
}

/* 初始化 */
